<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SQLite Inventory</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        table { width: 50%; border-collapse: collapse; margin-top: 20px; font-family: Arial, sans-serif; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <h2>Product Inventory (from SQLite)</h2>
    
    <table id="inventory-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody id="table-body">
            </tbody>
    </table>

    <script>
        const MY_SERVER = 'http://127.0.0.1:5000/items';
        const tableBody = document.getElementById('table-body');

        // Fetch data from Flask
        axios.get(MY_SERVER)
            .then(response => {
                const items = response.data;
                
                // Clear existing content
                tableBody.innerHTML = '';

                // Loop through data and create rows
                items.forEach(item => {
                    const row = `
                        <tr>
                            <td>${item.id}</td>
                            <td>${item.name}</td>
                            <td>${item.price}₪</td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            })
            .catch(error => {
                console.error("Error:", error);
                alert("Failed to load data from server.");
            });
    </script>
</body>
</html>
