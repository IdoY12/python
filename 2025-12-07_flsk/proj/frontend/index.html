<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tasks</title>

  <!-- Axios CDN -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      padding: 8px 0;
      border-bottom: 1px solid #ddd;
    }
  </style>
</head>
<body>

  <h1>Tasks</h1>
  <ul id="products"></ul>



  <script>
    axios.get('http://127.0.0.1:5000/')
      .then(response => {
        const tasks = response.data
        const list = document.getElementById('products')

        tasks.forEach(task => {
          const li = document.createElement('li')
          li.textContent = `1st ${task} - `
          list.appendChild(li)
          li.innerHTML = `second ${task}`
        })
      })
      .catch(error => {
        console.error('Error fetching products:', error)
      })
  </script>

</body>
</html>
