{% extends "base.html" %}
{% block content %}
<h1>Register</h1>

<form method="POST">
    <label>Username:
        <input type="text" name="username" required>
    </label>
    <label>Password:
        <input type="password" name="password" required>
    </label>
    <!-- אין בחירת role - כל משתמש חדש מקבל role="user" אוטומטית -->
    <!-- רק בעל האתר יכול לשנות ל-admin ישירות במסד הנתונים -->
    <button type="submit">Register</button>
</form>

<p>Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a></p>
{% endblock %}
