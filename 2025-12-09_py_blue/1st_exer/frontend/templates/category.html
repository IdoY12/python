{% extends "base.html" %}
{% block content %}
<h1>{{ title }}</h1>
<a href="{{ url_for(category + '.add') }}" class="btn">+ Add Article</a>

<div class="articles">
    {% for article in articles %}
    <div class="article-card">
        <h3><a href="{{ url_for(category + '.detail', article_id=article['id']) }}">{{ article['title'] }}</a></h3>
        <p>{{ article['content'][:100] }}...</p>
    </div>
    {% else %}
    <p>No articles yet.</p>
    {% endfor %}
</div>
{% endblock %}
